<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200mm" height="200mm">
  <!-- Outer frame -->
  <rect x="5" y="5" width="190" height="190" fill="none" stroke="#000" stroke-width="2"/>
  <!-- Second frame -->
  <rect x="15" y="15" width="170" height="170" fill="none" stroke="#000" stroke-width="1"/>
  <!-- Large central flower/rosette -->
  <!-- Petal rings -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#000" stroke-width="1.2"/>
  <circle cx="100" cy="100" r="45" fill="none" stroke="#000" stroke-width="1"/>
  <circle cx="100" cy="100" r="30" fill="none" stroke="#000" stroke-width="1"/>
  <circle cx="100" cy="100" r="15" fill="none" stroke="#000" stroke-width="1"/>
  <circle cx="100" cy="100" r="5" fill="none" stroke="#000" stroke-width="1"/>
  <!-- Radial lines creating petal effect (16 petals) -->
  <line x1="100" y1="40" x2="100" y2="160" stroke="#000" stroke-width="0.8"/>
  <line x1="40" y1="100" x2="160" y2="100" stroke="#000" stroke-width="0.8"/>
  <line x1="57.6" y1="57.6" x2="142.4" y2="142.4" stroke="#000" stroke-width="0.8"/>
  <line x1="142.4" y1="57.6" x2="57.6" y2="142.4" stroke="#000" stroke-width="0.8"/>
  <line x1="100" y1="40" x2="100" y2="160" stroke="#000" stroke-width="0.5"/>
  <!-- 22.5 degree interval lines -->
  <line x1="61.7" y1="45.7" x2="138.3" y2="154.3" stroke="#000" stroke-width="0.5"/>
  <line x1="45.7" y1="61.7" x2="154.3" y2="138.3" stroke="#000" stroke-width="0.5"/>
  <line x1="138.3" y1="45.7" x2="61.7" y2="154.3" stroke="#000" stroke-width="0.5"/>
  <line x1="154.3" y1="61.7" x2="45.7" y2="138.3" stroke="#000" stroke-width="0.5"/>
  <!-- Corner ornaments -->
  <path d="M15,15 Q35,15 35,35 Q35,15 55,15" fill="none" stroke="#000" stroke-width="1"/>
  <path d="M15,185 Q35,185 35,165 Q35,185 55,185" fill="none" stroke="#000" stroke-width="1"/>
  <path d="M185,15 Q165,15 165,35 Q165,15 145,15" fill="none" stroke="#000" stroke-width="1"/>
  <path d="M185,185 Q165,185 165,165 Q165,185 145,185" fill="none" stroke="#000" stroke-width="1"/>
  <!-- Corner small diamonds -->
  <polygon points="28,28 33,33 28,38 23,33" fill="none" stroke="#000" stroke-width="0.8"/>
  <polygon points="172,28 177,33 172,38 167,33" fill="none" stroke="#000" stroke-width="0.8"/>
  <polygon points="28,172 33,167 28,162 23,167" fill="none" stroke="#000" stroke-width="0.8"/>
  <polygon points="172,172 177,167 172,162 167,167" fill="none" stroke="#000" stroke-width="0.8"/>
  <!-- Mounting holes -->
  <circle cx="28" cy="100" r="3" fill="none" stroke="#000" stroke-width="1"/>
  <circle cx="172" cy="100" r="3" fill="none" stroke="#000" stroke-width="1"/>
  <circle cx="100" cy="28" r="3" fill="none" stroke="#000" stroke-width="1"/>
  <circle cx="100" cy="172" r="3" fill="none" stroke="#000" stroke-width="1"/>
</svg>
