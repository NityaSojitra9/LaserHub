<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="300mm" height="150mm">
  <!-- Frame border -->
  <rect x="2" y="2" width="296" height="146" fill="none" stroke="#000" stroke-width="2"/>
  <!-- Moon -->
