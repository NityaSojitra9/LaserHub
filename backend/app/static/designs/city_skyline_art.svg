  <rect x="36" y="95" width="5" height="5" fill="none" stroke="#000" stroke-width="0.7"/>
  <rect x="45" y="95" width="5" height="5" fill="none" stroke="#000" stroke-width="0.7"/>
  <rect x="36" y="105" width="5" height="5" fill="none" stroke="#000" stroke-width="0.7"/>
  <rect x="45" y="105" width="5" height="5" fill="none" stroke="#000" stroke-width="0.7"/>
  <rect x="36" y="115" width="5" height="5" fill="none" stroke="#000" stroke-width="0.7"/>
