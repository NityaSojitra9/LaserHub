  <rect x="272" y="80" width="5" height="5" fill="none" stroke="#000" stroke-width="0.7"/>
  <rect x="262" y="90" width="5" height="5" fill="none" stroke="#000" stroke-width="0.7"/>
  <rect x="272" y="90" width="5" height="5" fill="none" stroke="#000" stroke-width="0.7"/>
  <!-- Ground line -->
  <line x1="2" y1="145" x2="298" y2="145" stroke="#000" stroke-width="1.5"/>
</svg>
