  <circle cx="257" cy="28" r="18" fill="none" stroke="#000" stroke-width="0" class="moon-mask"/>
  <!-- Buildings left cluster -->
  <rect x="10" y="90" width="20" height="55" fill="none" stroke="#000" stroke-width="1.2"/>
  <rect x="12" y="95" width="4" height="6" fill="none" stroke="#000" stroke-width="0.8"/>
  <rect x="18" y="95" width="4" height="6" fill="none" stroke="#000" stroke-width="0.8"/>
  <rect x="12" y="107" width="4" height="6" fill="none" stroke="#000" stroke-width="0.8"/>
