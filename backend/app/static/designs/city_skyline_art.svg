  <rect x="204" y="85" width="5" height="5" fill="none" stroke="#000" stroke-width="0.7"/>
  <rect x="214" y="85" width="5" height="5" fill="none" stroke="#000" stroke-width="0.7"/>
  <rect x="204" y="95" width="5" height="5" fill="none" stroke="#000" stroke-width="0.7"/>
