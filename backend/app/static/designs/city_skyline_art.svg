  <rect x="144" y="48" width="6" height="6" fill="none" stroke="#000" stroke-width="0.7"/>
  <rect x="124" y="60" width="6" height="6" fill="none" stroke="#000" stroke-width="0.7"/>
  <rect x="134" y="60" width="6" height="6" fill="none" stroke="#000" stroke-width="0.7"/>
  <rect x="144" y="60" width="6" height="6" fill="none" stroke="#000" stroke-width="0.7"/>
  <rect x="124" y="72" width="6" height="6" fill="none" stroke="#000" stroke-width="0.7"/>
  <rect x="134" y="72" width="6" height="6" fill="none" stroke="#000" stroke-width="0.7"/>
