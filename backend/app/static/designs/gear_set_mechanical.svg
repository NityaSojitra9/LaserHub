<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 150" width="250mm" height="150mm">
  <!-- Large gear center-left -->
  <g transform="translate(65,75)">
    <!-- Outer teeth (12 teeth) -->
    <path d="M0,-55 L5,-48 L-5,-48 Z" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M26.7,-47.5 L28.9,-40.2 L19.5,-43.5 Z" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M47.5,-26.7 L43.5,-19.5 L40.2,-28.9 Z" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M55,0 L48,5 L48,-5 Z" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M47.5,26.7 L40.2,28.9 L43.5,19.5 Z" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M26.7,47.5 L19.5,43.5 L28.9,40.2 Z" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M0,55 L-5,48 L5,48 Z" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M-26.7,47.5 L-28.9,40.2 L-19.5,43.5 Z" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M-47.5,26.7 L-43.5,19.5 L-40.2,28.9 Z" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M-55,0 L-48,-5 L-48,5 Z" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M-47.5,-26.7 L-40.2,-28.9 L-43.5,-19.5 Z" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M-26.7,-47.5 L-19.5,-43.5 L-28.9,-40.2 Z" fill="none" stroke="#000" stroke-width="1"/>
    <!-- Main gear circle -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#000" stroke-width="1"/>
    <!-- Hub spokes -->
    <line x1="0" y1="-32" x2="0" y2="-14" stroke="#000" stroke-width="2"/>
    <line x1="0" y1="14" x2="0" y2="32" stroke="#000" stroke-width="2"/>
    <line x1="-32" y1="0" x2="-14" y2="0" stroke="#000" stroke-width="2"/>
    <line x1="14" y1="0" x2="32" y2="0" stroke="#000" stroke-width="2"/>
    <line x1="22.6" y1="-22.6" x2="9.9" y2="-9.9" stroke="#000" stroke-width="2"/>
    <line x1="-22.6" y1="-22.6" x2="-9.9" y2="-9.9" stroke="#000" stroke-width="2"/>
    <line x1="22.6" y1="22.6" x2="9.9" y2="9.9" stroke="#000" stroke-width="2"/>
    <line x1="-22.6" y1="22.6" x2="-9.9" y2="9.9" stroke="#000" stroke-width="2"/>
    <!-- Center axle hole -->
    <circle cx="0" cy="0" r="7" fill="none" stroke="#000" stroke-width="1.5"/>
  </g>

  <!-- Small gear upper-right -->
  <g transform="translate(155,42)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#000" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="-28" x2="0" y2="-18" stroke="#000" stroke-width="1.5"/>
    <line x1="0" y1="18" x2="0" y2="28" stroke="#000" stroke-width="1.5"/>
    <line x1="-28" y1="0" x2="-18" y2="0" stroke="#000" stroke-width="1.5"/>
    <line x1="18" y1="0" x2="28" y2="0" stroke="#000" stroke-width="1.5"/>
    <line x1="0" y1="-18" x2="0" y2="-8" stroke="#000" stroke-width="1.5"/>
    <line x1="0" y1="8" x2="0" y2="18" stroke="#000" stroke-width="1.5"/>
    <line x1="-18" y1="0" x2="-8" y2="0" stroke="#000" stroke-width="1.5"/>
    <line x1="8" y1="0" x2="18" y2="0" stroke="#000" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="none" stroke="#000" stroke-width="1.5"/>
  </g>

  <!-- Small gear lower-right -->
  <g transform="translate(185,108)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#000" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="-22" x2="0" y2="-14" stroke="#000" stroke-width="1.5"/>
    <line x1="0" y1="14" x2="0" y2="22" stroke="#000" stroke-width="1.5"/>
    <line x1="-22" y1="0" x2="-14" y2="0" stroke="#000" stroke-width="1.5"/>
    <line x1="14" y1="0" x2="22" y2="0" stroke="#000" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="none" stroke="#000" stroke-width="1.5"/>
  </g>
</svg>
