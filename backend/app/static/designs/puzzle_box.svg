<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300mm" height="200mm">
  <!-- Box side panel (with finger joints) -->
  <!-- Bottom panel -->
  <g transform="translate(10,130)">
    <!-- Main rectangle -->
    <rect x="0" y="0" width="120" height="60" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- Finger joints top -->
    <rect x="15" y="-8" width="15" height="8" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="45" y="-8" width="15" height="8" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="75" y="-8" width="15" height="8" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="105" y="-8" width="15" height="8" fill="none" stroke="#000" stroke-width="1"/>
    <!-- Finger joints bottom -->
    <rect x="15" y="60" width="15" height="8" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="45" y="60" width="15" height="8" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="75" y="60" width="15" height="8" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="105" y="60" width="15" height="8" fill="none" stroke="#000" stroke-width="1"/>
    <!-- Decorative engraving pattern -->
    <rect x="10" y="10" width="100" height="40" rx="3" fill="none" stroke="#000" stroke-width="0.8"/>
    <line x1="60" y1="10" x2="60" y2="50" stroke="#000" stroke-width="0.8"/>
    <line x1="10" y1="30" x2="110" y2="30" stroke="#000" stroke-width="0.8"/>
  </g>

  <!-- Side panel left -->
  <g transform="translate(10,10)">
    <rect x="0" y="0" width="60" height="110" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- Right side finger joints -->
    <rect x="60" y="15" width="8" height="15" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="60" y="45" width="8" height="15" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="60" y="75" width="8" height="15" fill="none" stroke="#000" stroke-width="1"/>
    <!-- Decorative window cutout -->
    <rect x="10" y="20" width="40" height="50" rx="4" fill="none" stroke="#000" stroke-width="1"/>
    <!-- Cross detail -->
    <line x1="30" y1="20" x2="30" y2="70" stroke="#000" stroke-width="0.8"/>
    <line x1="10" y1="45" x2="50" y2="45" stroke="#000" stroke-width="0.8"/>
  </g>

  <!-- Lid panel -->
  <g transform="translate(150,10)">
    <rect x="0" y="0" width="136" height="76" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- Sliding groove -->
    <rect x="5" y="5" width="126" height="10" rx="2" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="5" y="61" width="126" height="10" rx="2" fill="none" stroke="#000" stroke-width="1"/>
    <!-- Center decorative star/mandala -->
    <circle cx="68" cy="38" r="22" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="68" cy="38" r="14" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="68" cy="38" r="6" fill="none" stroke="#000" stroke-width="1"/>
    <line x1="68" y1="16" x2="68" y2="60" stroke="#000" stroke-width="0.8"/>
    <line x1="46" y1="38" x2="90" y2="38" stroke="#000" stroke-width="0.8"/>
    <line x1="52.4" y1="22.4" x2="83.6" y2="53.6" stroke="#000" stroke-width="0.8"/>
    <line x1="83.6" y1="22.4" x2="52.4" y2="53.6" stroke="#000" stroke-width="0.8"/>
    <!-- Finger pull -->
    <rect x="55" y="1" width="26" height="4" rx="2" fill="none" stroke="#000" stroke-width="1"/>
  </g>

  <!-- Front panel -->
  <g transform="translate(150,105)">
    <rect x="0" y="0" width="120" height="60" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- Finger joints left/right -->
    <rect x="-8" y="15" width="8" height="15" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="-8" y="40" width="8" height="15" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="120" y="15" width="8" height="15" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="120" y="40" width="8" height="15" fill="none" stroke="#000" stroke-width="1"/>
    <!-- Decorative panel -->
    <rect x="10" y="10" width="100" height="40" rx="3" fill="none" stroke="#000" stroke-width="0.8"/>
    <polygon points="60,15 75,30 60,45 45,30" fill="none" stroke="#000" stroke-width="0.8"/>
  </g>
</svg>
